config setup
    charondebug="ike 2, knl 2, cfg 2"
    uniqueids=no

conn gcp-vpn
    keyexchange=ikev2
    authby=psk
    type=tunnel
    auto=start
    closeaction=restart
    keyingtries=%forever

    # Local
    left=%defaultroute
    leftid=%any
    leftsubnet=<YOUR_ONPREM_CIDR>

    # GCP
    right=<GCP_VPN_GATEWAY_IP>
    rightid=<GCP_VPN_GATEWAY_IP>
    rightsubnet=<GCP_SUBNET_CIDR>

    # Crypto
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!

    # Keepalive and automatic reconnection
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s

    # Compression
    compress=no
